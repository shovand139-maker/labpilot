name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Build the page
        run: python build.py

      - name: Committed build matches the source
        run: git diff --exit-code -- docs/index.html

      - name: Unit, API and fault-injection tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end walk-through (Playwright)
        run: npm run e2e

      - name: Strict Content-Security-Policy check
        run: npm run test:csp

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: shots/
          if-no-files-found: ignore
